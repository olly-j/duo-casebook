name: CASEBOOK quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Catalogue and publication audit
        run: ./dev audit
      - name: Python and discovery contracts
        run: python3 -m unittest tests.test_spine_runtime tests.test_spine_liveness tests.test_discovery tests.test_adsense_readiness
      - name: Interface and advertising contracts
        run: node --test tests/polish.test.cjs tests/ux-polish.test.cjs tests/ui-launch.test.cjs tests/ads.test.cjs tests/privacy-center.test.cjs tests/google-cmp-provider.test.cjs tests/cmp-bootstrap.test.cjs tests/glass.test.cjs
      - name: Check progressive glass loader syntax
        run: node --check web/glass.js
      - name: Rebuild deterministically
        run: |
          python3 build_data.py
          python3 prepare_site.py
          git diff --exit-code -- web/data.js web/catalogue.json docs research/catalogue-summary.json
